name: Build Windows Agent (EXE)
on:
  push:
    paths: ["agent/**", ".github/workflows/windows-agent.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Build EXE
        run: >
          pyinstaller --onefile --name WinAssistantAgent
          --hidden-import comtypes --hidden-import comtypes.client
          --collect-submodules pywinauto
          main.py
      - uses: actions/upload-artifact@v4
        with:
          name: WinAssistantAgent-exe
          path: agent/dist/WinAssistantAgent.exe

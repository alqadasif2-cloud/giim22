name: Build Windows Agent (EXE)
on:
  push:
    paths: ["agent/**", ".github/workflows/windows-agent.yml"]
  pull_request:
    paths: ["agent/**", ".github/workflows/windows-agent.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pyinstaller pywin32

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name WinAssistantAgent \
            --paths . \
            --collect-all winagent \
            --collect-all pywinauto \
            --hidden-import comtypes \
            --hidden-import comtypes.client \
            --hidden-import comtypes.stream \
            --hidden-import win32timezone \
            --hidden-import pywintypes \
            --hidden-import win32gui \
            --hidden-import win32con \
            --hidden-import win32api \
            main.py

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/WinAssistantAgent.exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinAssistantAgent-exe
          path: agent/dist/WinAssistantAgent.exe
          if-no-files-found: error
